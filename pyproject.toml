[project]
name = "chat-insight-engine"
version = "0.2.0"
description = "Local-first RAG and map-reduce LLM engine that turns large WhatsApp group chats into grounded, cited research insight."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5",
    "openai>=1.40",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]

[project.scripts]
chat-insight = "chat_insight.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_insight"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B904", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
